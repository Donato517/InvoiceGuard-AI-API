# =============================================================
# Alembic config (database migrations)
# - NOTE: keep this file ASCII-only. Alembic reads it with the OS locale
#   encoding (cp950 on zh-TW Windows), so non-ASCII comments break it.
# - The DB URL is NOT set here; app/db/migrations/env.py reads it from env vars.
# - Workflow: see app/db/README.md (section 7).
# =============================================================
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
# Revision file name: date_revision_slug, e.g. 20261021_a1b2c3d4e5f6_create_users.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
